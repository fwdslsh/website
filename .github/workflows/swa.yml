name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # On a closed PR only close_pull_request_job should run; uploading again races it and leaks the preview environment.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout
        uses: actions/checkout@v4      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test the generator's scripts
        run: npm run test:scripts

      # One step: unify composes once, audits that exact result, and writes dist/
      # only if the audit passes (--audit --strict). Shared flags live in unify.yaml at the repository root.
      - name: Build site (audited)
        run: npm run build

      - name: List Files
        run: tree -r ./dist
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DUNE_0803B6B10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_build_command: "" # App build command
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./dist" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  # After main deploys, publish any post dev.to does not carry yet, its canonical
  # URL pointing here. Needs the DEVTO_API_KEY secret (dev.to → Settings →
  # Extensions → DEV Community API Keys); without it the step says so and passes.
  crosspost_devto_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: Cross-post to dev.to
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish new posts to dev.to
        run: npm run crosspost
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DUNE_0803B6B10 }}
          action: "close"

