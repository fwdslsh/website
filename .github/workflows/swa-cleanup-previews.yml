# TEMPORARY: deletes Azure Static Web Apps preview environments left behind by
# closed pull requests. Run it from Actions > "Clean up SWA previews" > Run workflow,
# then delete this file once the stale previews are gone.
#
# The deploy action's "close" mode removes the preview for the pull request
# named in the event file at $GITHUB_EVENT_PATH. A manual run has no pull request,
# so each job writes the PR number into that file before calling "close".
name: Clean up SWA previews

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Closed PR numbers whose previews to delete, comma-separated (e.g. 1,2,3)'
        required: true
        default: '1,2,3'

permissions:
  contents: read
  pull-requests: read

jobs:
  close_preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(format('[{0}]', inputs.pr_numbers)) }}
    name: Close preview for PR ${{ matrix.pr }}
    steps:
      - name: Point the event at PR ${{ matrix.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rebuild the event a real "pull_request: closed" run would carry: the
          # action reads pull_request.{number,html_url,title,base,head} and repository.
          gh api "repos/${{ github.repository }}/pulls/${{ matrix.pr }}" > pr.json
          gh api "repos/${{ github.repository }}" > repo.json
          jq -n --slurpfile pr pr.json --slurpfile repo repo.json \
            '{action: "closed", number: $pr[0].number, pull_request: $pr[0], repository: $repo[0]}' > event.json
          cp event.json "$GITHUB_EVENT_PATH"
          jq '{action, number, pr: .pull_request.html_url, head: .pull_request.head.ref}' "$GITHUB_EVENT_PATH"
      - name: Close preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DUNE_0803B6B10 }}
          action: "close"
