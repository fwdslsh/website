# Saved unify CLI flags (keys are long option names; CLI flags win). Only what differs from the defaults.
# the address the site is published at: sitemap.xml, feed.xml and absolute URLs come from it
base-url: https://fwdslsh.dev/
# /rabit/docs/ rather than /rabit/docs.html
pretty-urls: true
# a canonical link on every page
canonical: auto
# scripts/gen.mjs writes the post lists before every build, dev rebuild and audit
generate: scripts/gen.mjs
# hands the generator every source page's title, description, date and metas (it reads nothing else)
source-inventory: true
